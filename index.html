    <script>
      ;(function () {
        var p = (location.pathname + location.search + location.hash).toLowerCase()
        if (
          /(?:^|\/)\.env(?:\.|$)/.test(p) ||
          /(?:^|\/)\.git(?:\/|$)/.test(p) ||
          /\/wp-admin/.test(p) ||
          /\/wp-login/.test(p) ||
          /\/phpmyadmin/.test(p) ||
          /\/xmlrpc\.php/.test(p) ||
          /\/phpinfo/.test(p) ||
          /<script/.test(p) ||
          /javascript:/.test(p)
        ) {
          document.title = 'Acesso bloqueado'
          document.documentElement.innerHTML =
            '<body style="margin:0;background:#0b1220;color:#e2e8f0;font-family:system-ui;display:grid;place-items:center;min-height:100dvh"><p style="font-weight:800">Acesso bloqueado</p></body>'
          return
        }
        var h = (location.hostname || '').toLowerCase().replace(/^www\./, '')
        var canon = document.querySelector('link[rel="canonical"]')
        if (h === 'ofertadecarga.com.br') {
          document.title = 'Calcular rota — Oferta de Carga'
          if (canon) canon.setAttribute('href', 'https://ofertadecarga.com.br/')
          if (location.search || location.hash) {
            history.replaceState(null, '', '/')
          }
        } else if (h === 'mapadafrota.com.br') {
          document.title = 'Mapa da Frota — Oferta de Carga'
          if (canon) canon.setAttribute('href', 'https://mapadafrota.com.br/')
          if (location.search || location.hash) {
            history.replaceState(null, '', '/')
          }
        } else if (h === 'mapadalogistica.com.br') {
          document.title = 'Mapa da Logística — Doca Livre'
          if (canon) canon.setAttribute('href', 'https://mapadalogistica.com.br/')
          if (location.search || location.hash) {
            history.replaceState(null, '', '/')
          }
        } else if (h === 'sistema.ofertadecarga.com.br' || h === 'ofertadecargas.docalivre.com.br') {
          document.title = 'Sistema — Oferta de Carga'
          if (canon) canon.setAttribute('href', 'https://ofertadecargas.docalivre.com.br/')
        }
      })()

    <script>
      // Chrome: extensão/SW fecha o canal depois de return true — não é bug do app.
      window.addEventListener('unhandledrejection', function (e) {
        var m = e && e.reason && (e.reason.message || String(e.reason))
        if (
          m &&
          (m.indexOf('message channel closed') !== -1 || m.indexOf('non-precached-url') !== -1)
        ) {
          e.preventDefault()
        }
      })
      // Marca o build. Não recarrega a página — isso deixava a 1ª visita em branco.
      ;(function () {
        var BUILD = 'rota-publico-cache-v184'
        try {
          localStorage.setItem('doca-html-bust', BUILD)
        } catch (e) {}
      })()
    </script>
