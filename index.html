    <title>Doca Livre — Oferta de Carga</title>
    <script>
      ;(function () {
        var p = (location.pathname + location.search + location.hash).toLowerCase()
        if (
          /(?:^|\/)\.env(?:\.|$)/.test(p) ||
          /(?:^|\/)\.git(?:\/|$)/.test(p) ||
          /\/wp-admin/.test(p) ||
          /\/wp-login/.test(p) ||
          /\/phpmyadmin/.test(p) ||
          /\/xmlrpc\.php/.test(p) ||
          /\/phpinfo/.test(p) ||
          /<script/.test(p) ||
          /javascript:/.test(p)
        ) {
          document.title = 'Acesso bloqueado'
          document.documentElement.innerHTML =
            '<body style="margin:0;background:#0b1220;color:#e2e8f0;font-family:system-ui;display:grid;place-items:center;min-height:100dvh"><p style="font-weight:800">Acesso bloqueado</p></body>'
          return
        }
        var h = (location.hostname || '').toLowerCase().replace(/^www\./, '')
        var canon = document.querySelector('link[rel="canonical"]')
        if (h === 'ofertadecarga.com.br') {
          document.title = 'Calcular rota — Oferta de Carga'
          if (canon) {
            canon.setAttribute('href', 'https://ofertadecarga.com.br/' + (location.search || ''))
          }
          if (location.hash) {
            var hash = location.hash.replace(/^#/, '')
            var hp = hash.split('?')[0].replace(/^\//, '')
            var hq = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?')) : ''
            if (!hp || hp === 'rota' || hp === 'calcular-rota' || hp === 'diego-lab') {
              history.replaceState(null, '', '/' + (hq || location.search || ''))
            } else if (hp === 'frete-minimo') {
              history.replaceState(null, '', '/frete-minimo' + (hq || location.search || ''))
            }
          }
        } else if (h === 'mapadafrota.com.br') {
          document.title = 'Mapa da Frota — Oferta de Carga'
          if (canon) {
            canon.setAttribute('href', 'https://mapadafrota.com.br/' + (location.search || ''))
          }
          if (location.hash) {
            var hashF = location.hash.replace(/^#/, '')
            var hpF = hashF.split('?')[0].replace(/^\//, '')
            var hqF = hashF.indexOf('?') >= 0 ? hashF.slice(hashF.indexOf('?')) : ''
            if (!hpF || hpF === 'mapa') {
              history.replaceState(null, '', '/' + (hqF || location.search || ''))
            }
          }
        } else if (h === 'mapadalogistica.com.br') {
          document.title = 'Mapa da Logística — Doca Livre'
          if (canon) {
            canon.setAttribute('href', 'https://mapadalogistica.com.br/' + (location.search || ''))
          }
          if (location.hash) {
            var hashL = location.hash.replace(/^#/, '')
            var hpL = hashL.split('?')[0].replace(/^\//, '')
            var hqL = hashL.indexOf('?') >= 0 ? hashL.slice(hashL.indexOf('?')) : ''
            if (!hpL || hpL === 'mapa' || hpL === 'app' || hpL === 'app/mapa') {
              history.replaceState(null, '', '/' + (hqL || location.search || ''))
            }
          }
        } else if (h === 'sistema.ofertadecarga.com.br' || h === 'ofertadecargas.docalivre.com.br') {
          document.title = 'Sistema — Oferta de Carga'
          if (canon) canon.setAttribute('href', 'https://ofertadecargas.docalivre.com.br/')
        }
      })()
    </script>

  <body>
    <script>
      // Chrome: extensão/SW fecha o canal depois de return true — não é bug do app.
      window.addEventListener('unhandledrejection', function (e) {
        var m = e && e.reason && (e.reason.message || String(e.reason))
        if (
          m &&
          (m.indexOf('message channel closed') !== -1 || m.indexOf('non-precached-url') !== -1)
        ) {
          e.preventDefault()
        }
      })
      // Marca o build. Não recarrega a página — isso deixava a 1ª visita em branco.
      ;(function () {
        var BUILD = 'rota-publico-cache-v212'
        try {
          localStorage.setItem('doca-html-bust', BUILD)
        } catch (e) {}
        var h = (location.hostname || '').toLowerCase().replace(/^www\./, '')
        var publico =
          h === 'ofertadecarga.com.br' ||
          h === 'mapadafrota.com.br' ||
          h === 'mapadalogistica.com.br'
        if (publico && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister()
            })
          })
        }
        window.setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.getAttribute('data-booted') === '1') return
          var boot = document.getElementById('doca-boot')
          if (!boot) return
          boot.innerHTML =
            '<p style="margin:0 0 10px;font-weight:800">A calculadora não carregou.</p>' +
            '<button type="button" id="doca-boot-retry" style="border:0;border-radius:10px;padding:10px 14px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer">Tentar de novo</button>'
          var btn = document.getElementById('doca-boot-retry')
          if (btn)
            btn.onclick = function () {
              location.reload()
            }
        }, 12000)
      })()
    </script>
    <div id="root">
      <div
        id="doca-boot"
        style="min-height:100dvh;display:grid;place-items:center;background:#efe8dc;color:#0f172a;font-family:system-ui,sans-serif;text-align:center;padding:24px"
      >
        <p style="margin:0;font-weight:800">Carregando a calculadora de rota…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
