plugins {
    id 'com.android.application'
}

// A chave de assinatura fica fora do repositorio (android/assinatura, so neste computador). Todo instalador
// precisa sair assinado com a mesma chave, para cada versao nova instalar por cima da anterior.
def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'br.com.docalivre.ofertadecarga'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.docalivre.ofertadecarga'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias 'ofertadecarga'
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.core:core:1.13.1'
}
